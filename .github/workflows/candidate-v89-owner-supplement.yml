name: Build private V89 owner supplement (limited validation)
on:
  push:
    branches: [candidate-v89-2380526-owner-supplement]
permissions:
  contents: read
  actions: read
concurrency:
  group: aoh3-reviewed-pair
  cancel-in-progress: false
env:
  AOH_CI_SOURCE: '238052634fca19a0b7279e541ed227970085045c'
  AOH_OWNER_BOOTSTRAP_BLOB: '656cfe1394c78ff5983d2439fd8c767c54e0b981'
  AOH_OWNER_BOOTSTRAP_SHA256: 'a3a32e05748b09b2872a53d35798eeb9ae80c5b685e524a9406e8a7309780f2a'
  AOH_OWNER_SUPPLEMENT_TOOL_BLOB: '6314e1c274ab90dfa5e90e409fd593d3c61ea32c'
  AOH_OWNER_SUPPLEMENT_TOOL_SHA256: '163722b0a7dc6703e96393ebb2d5a12640b4ce91ef4a6a60b8346c7ad07ec05d'
  AOH_OWNER_FINALIZER_BLOB: '8e48ca6b6beeb44550ff52f6ebf51a2a95531863'
  AOH_OWNER_FINALIZER_SHA256: 'bf6447f7438a87dc917f05160f6fa54cd00bfa4ad22467068377f568791ad0ac'
jobs:
  owner:
    if: github.repository == 'zhui9808-netizen/aoh3-public-build' && github.ref == 'refs/heads/candidate-v89-2380526-owner-supplement' && github.event.deleted == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout the public launcher only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare private workspace and require the configured source credential
        env:
          GH_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/aoh3-private"
          if test -z "$GH_TOKEN"; then
            echo 'BUILD_SOURCE_TOKEN is not configured. Add it in this repository Actions secrets, then run this workflow again.'
            exit 1
          fi
          if ! python3 - <<'PY' >"$RUNNER_TEMP/aoh3-private/checkout.log" 2>&1
          import base64, json, os, pathlib, re, subprocess
          source = os.environ['AOH_CI_SOURCE']
          assert source == '238052634fca19a0b7279e541ed227970085045c'
          info = json.loads(subprocess.check_output(['gh', 'api', 'repos/zhui9808-netizen/codex-test']))
          assert info['private'] is True and info['id'] == 1357139625 and info['full_name'] == 'zhui9808-netizen/codex-test'
          token = os.environ.pop('GH_TOKEN')
          env = dict(os.environ)
          env.update(GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1',
                     GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode())
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aoh3-private/source'
          # Fetch the pinned source with its complete ancestor history. Private
          # evidence lives on unrelated backup branches and is not a build input.
          # No shallow history or partial blobs: offline baseline audits stay valid.
          subprocess.run(['git', 'init', str(root)], check=True)
          subprocess.run(['git', '-C', str(root), 'remote', 'add', 'origin', 'https://github.com/zhui9808-netizen/codex-test.git'], check=True)
          subprocess.run(['git', '-C', str(root), 'fetch', '--no-tags', 'origin', source], env=env, check=True, timeout=900)
          subprocess.run(['git', '-C', str(root), 'checkout', '--detach', source], check=True)
          assert subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD']).decode().strip() == source
          assert subprocess.check_output(['git', '-C', str(root), 'rev-parse', '--is-shallow-repository']).decode().strip() == 'false'
          PY
          then
            echo 'Private source checkout failed. No source or private log was published.'
            exit 1
          fi
          echo 'Reviewed private source checkout completed.'
      - name: Use the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Prepare the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          if ! (
            test "$RUNNER_ENVIRONMENT" = github-hosted
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential libarchive-dev unzip patch zstd libegl1 libgl1-mesa-dri
            sudo apt-get clean
          ) >"$RUNNER_TEMP/aoh3-private/prerequisites.log" 2>&1; then
            echo 'Runner prerequisites failed. Private logs were not published.'
            exit 1
          fi
          echo 'Runner prerequisites completed.'
      - name: Run private owner supplement only
        env:
          GH_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
          AOH_PUBLIC_RUN_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! timeout --signal=INT --kill-after=180s 230m \
            python3 "$GITHUB_WORKSPACE/.github/owner_v89_supplement_launcher.py" \
            > "$RUNNER_TEMP/aoh3-private/build.log" 2>&1; then
            echo 'Private owner supplement did not complete. No APK or raw build log was published publicly.'
            exit 1
          fi
          echo 'Private owner supplement completed. This is not full three-product acceptance.'
      - name: Remove ephemeral private data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          retired=0
          if test -f "$RUNNER_TEMP/aoh3-private/source/tools/retire_public_runner.py"; then
            python3 "$RUNNER_TEMP/aoh3-private/source/tools/retire_public_runner.py" > /dev/null 2>&1 || retired=1
          fi
          find /dev/shm -maxdepth 1 -type d -name 'aoh3-signing-*' -user "$(id -un)" -exec rm -rf -- {} +
          rm -rf -- "$RUNNER_TEMP/aoh3-private" "$RUNNER_TEMP/aoh3-delivery"
          test "$retired" = 0
