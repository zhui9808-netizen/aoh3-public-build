name: Build verified AoH3 APK pair
on:
  push:
    branches: [main]
    paths: [.github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: aoh3-reviewed-pair
  cancel-in-progress: false
env:
  # The publication tool replaces this one sentinel with the reviewed private SHA.
  AOH_CI_SOURCE: 'e8823f63c493b8ae6a54bfb14c4f1e35b051411d'
jobs:
  pair:
    if: github.repository == 'zhui9808-netizen/aoh3-public-build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout the public launcher only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare private workspace and require the configured source credential
        env:
          GH_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/aoh3-private"
          if test -z "$GH_TOKEN"; then
            echo 'BUILD_SOURCE_TOKEN is not configured. Add it in this repository Actions secrets, then run this workflow again.'
            exit 1
          fi
          if ! python3 - <<'PY' >"$RUNNER_TEMP/aoh3-private/checkout.log" 2>&1
          import base64, json, os, pathlib, re, subprocess
          source = os.environ['AOH_CI_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', source) and source != '0' * 40
          info = json.loads(subprocess.check_output(['gh', 'api', 'repos/zhui9808-netizen/codex-test']))
          assert info['private'] is True and info['full_name'] == 'zhui9808-netizen/codex-test'
          token = os.environ.pop('GH_TOKEN')
          env = dict(os.environ)
          env.update(GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1',
                     GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode())
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aoh3-private/source'
          subprocess.run(['git', 'clone', '--no-checkout', 'https://github.com/zhui9808-netizen/codex-test.git', str(root)], env=env, check=True)
          subprocess.run(['git', '-C', str(root), 'checkout', '--detach', source], check=True)
          assert subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD']).decode().strip() == source
          PY
          then
            echo 'Private source checkout failed. No source or private log was published.'
            exit 1
          fi
          echo 'Reviewed private source checkout completed.'
      - name: Use the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Prepare the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          if ! (
            test "$RUNNER_ENVIRONMENT" = github-hosted
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential libarchive-dev unzip patch
            sudo apt-get clean
          ) >"$RUNNER_TEMP/aoh3-private/prerequisites.log" 2>&1; then
            echo 'Runner prerequisites failed. Private logs were not published.'
            exit 1
          fi
          echo 'Runner prerequisites completed.'
      - name: Build, sign, independently audit, and retain full evidence privately
        env:
          GH_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
          AOH_PUBLIC_RUN_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          # This dedicated entrypoint validates the exact rendered launcher and
          # public run identity without pretending the private SHA is GITHUB_SHA.
          if ! python3 "$RUNNER_TEMP/aoh3-private/source/tools/public_runner_pair.py" \
            --source "$AOH_CI_SOURCE" \
            --launcher "$GITHUB_WORKSPACE/.github/workflows/build.yml" \
            --output "$RUNNER_TEMP/aoh3-delivery" \
            >"$RUNNER_TEMP/aoh3-private/build.log" 2>&1; then
            retention_status=unavailable
            if test -f "$RUNNER_TEMP/aoh3-private/failure-status.txt"; then
              read -r retention_status <"$RUNNER_TEMP/aoh3-private/failure-status.txt" || true
            fi
            case "$retention_status" in
              saved) echo 'Failure evidence was retained in a private codex-test draft for this run.' ;;
              *) echo 'Private failure retention did not complete; no raw failure output was published.' ;;
            esac
            echo 'Paired build or independent verification failed. No APK or private failure log was published.'
            exit 1
          fi
          echo "Verified APK pair completed for source $AOH_CI_SOURCE."
      - name: Deliver only the verified APK pair and fixed-schema public receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aoh3-verified-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aoh3-delivery/aoh3-multiplayer-client.apk
            ${{ runner.temp }}/aoh3-delivery/aoh3-phone-server.apk
            ${{ runner.temp }}/aoh3-delivery/verification.json
            ${{ runner.temp }}/aoh3-delivery/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Remove ephemeral private data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          find /dev/shm -maxdepth 1 -type d -name 'aoh3-signing-*' -user "$(id -un)" -exec rm -rf -- {} +
          rm -rf -- "$RUNNER_TEMP/aoh3-private" "$RUNNER_TEMP/aoh3-delivery"
