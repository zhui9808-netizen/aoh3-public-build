name: Publish reviewed v70 APK pair
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v70.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: aoh3-reviewed-v70-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'zhui9808-netizen/aoh3-public-build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch only the frozen accepted APK pair
        env:
          GH_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          PLAN64 = ''

          import base64, hashlib, json, os, pathlib, subprocess
          plan = json.loads(base64.b64decode(PLAN64))
          public = 'zhui9808-netizen/aoh3-public-build'
          private = 'zhui9808-netizen/codex-test'
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aoh3-reviewed-promotion'
          def api(path, value=None, optional=False):
              command = ['gh', 'api', path]
              if value is not None: command += ['--method', 'POST', '--input', '-']
              result = subprocess.run(command, input=None if value is None else json.dumps(value).encode(), capture_output=True)
              if result.returncode:
                  if optional and value is None:
                      try: missing = json.loads(result.stdout)
                      except Exception: missing = {}
                      if missing.get('status') == '404': return None
                  raise RuntimeError('GitHub metadata operation failed')
              return json.loads(result.stdout)
          def sha(path):
              with path.open('rb') as stream: return hashlib.file_digest(stream, 'sha256').hexdigest()
          def encoded(value): return (json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + '\n').encode()
          def stream_asset(repo, asset, output=None):
              digest = hashlib.sha256(); size = 0
              proc = subprocess.Popen(['gh', 'api', 'repos/' + repo + '/releases/assets/' + str(asset), '-H', 'Accept: application/octet-stream'], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              try:
                  while block := proc.stdout.read(2**20):
                      size += len(block); digest.update(block)
                      if output is not None: output.write(block)
                  if proc.wait() != 0: raise RuntimeError('Release asset transfer failed')
              finally:
                  if proc.poll() is None: proc.kill(); proc.wait()
              return size, digest.hexdigest()
          verification = encoded(plan['verification'])
          expected = dict(plan['apks'])
          expected['verification.json'] = {'bytes': len(verification), 'sha256': hashlib.sha256(verification).hexdigest()}
          sums = ''.join(expected[n]['sha256'] + '  ' + n + '\n' for n in sorted(expected)).encode()
          expected['SHA256SUMS.txt'] = {'bytes': len(sums), 'sha256': hashlib.sha256(sums).hexdigest()}
          def validate_stage():
              assert stage.is_dir() and not stage.is_symlink()
              assert {p.name for p in stage.iterdir()} == set(expected)
              for name, row in expected.items():
                  path = stage / name
                  assert path.is_file() and not path.is_symlink()
                  assert path.stat().st_size == row['bytes'] and sha(path) == row['sha256']

          assert api('repos/' + private)['private'] is True
          assert api('repos/' + public)['private'] is False
          run = api('repos/' + public + '/actions/runs/' + str(plan['buildRun']))
          assert run['id'] == plan['buildRun'] and run['head_sha'] == plan['launcher']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          commit = api('repos/' + private + '/git/commits/' + plan['source'])
          assert commit['sha'] == plan['source'] and commit['tree']['sha'] == plan['tree']
          release = api('repos/' + private + '/releases/' + str(plan['privateRelease']))
          assert release['id'] == plan['privateRelease'] and not release['draft'] and release['prerelease']
          assert release['target_commitish'] == plan['source']
          stage.mkdir(mode=0o700, exist_ok=False)
          for name, row in plan['apks'].items():
              matches = [a for a in release['assets'] if a['id'] == row['assetId'] and a['name'] == name]
              assert len(matches) == 1
              remote = matches[0]
              assert remote['state'] == 'uploaded' and remote['size'] == row['bytes']
              assert remote['digest'] == 'sha256:' + row['sha256']
              with (stage / name).open('xb') as output: size, digest = stream_asset(private, row['assetId'], output)
              assert size == row['bytes'] and digest == row['sha256']
          (stage / 'verification.json').write_bytes(verification)
          (stage / 'SHA256SUMS.txt').write_bytes(sums)
          validate_stage()
          print('Reviewed APK pair downloaded and byte-verified. No private test archive staged.')

          PY
      - name: Publish after complete remote byte verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          PLAN64 = ''

          import base64, hashlib, json, os, pathlib, subprocess
          plan = json.loads(base64.b64decode(PLAN64))
          public = 'zhui9808-netizen/aoh3-public-build'
          private = 'zhui9808-netizen/codex-test'
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aoh3-reviewed-promotion'
          def api(path, value=None, optional=False):
              command = ['gh', 'api', path]
              if value is not None: command += ['--method', 'POST', '--input', '-']
              result = subprocess.run(command, input=None if value is None else json.dumps(value).encode(), capture_output=True)
              if result.returncode:
                  if optional and value is None:
                      try: missing = json.loads(result.stdout)
                      except Exception: missing = {}
                      if missing.get('status') == '404': return None
                  raise RuntimeError('GitHub metadata operation failed')
              return json.loads(result.stdout)
          def sha(path):
              with path.open('rb') as stream: return hashlib.file_digest(stream, 'sha256').hexdigest()
          def encoded(value): return (json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + '\n').encode()
          def stream_asset(repo, asset, output=None):
              digest = hashlib.sha256(); size = 0
              proc = subprocess.Popen(['gh', 'api', 'repos/' + repo + '/releases/assets/' + str(asset), '-H', 'Accept: application/octet-stream'], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              try:
                  while block := proc.stdout.read(2**20):
                      size += len(block); digest.update(block)
                      if output is not None: output.write(block)
                  if proc.wait() != 0: raise RuntimeError('Release asset transfer failed')
              finally:
                  if proc.poll() is None: proc.kill(); proc.wait()
              return size, digest.hexdigest()
          verification = encoded(plan['verification'])
          expected = dict(plan['apks'])
          expected['verification.json'] = {'bytes': len(verification), 'sha256': hashlib.sha256(verification).hexdigest()}
          sums = ''.join(expected[n]['sha256'] + '  ' + n + '\n' for n in sorted(expected)).encode()
          expected['SHA256SUMS.txt'] = {'bytes': len(sums), 'sha256': hashlib.sha256(sums).hexdigest()}
          def validate_stage():
              assert stage.is_dir() and not stage.is_symlink()
              assert {p.name for p in stage.iterdir()} == set(expected)
              for name, row in expected.items():
                  path = stage / name
                  assert path.is_file() and not path.is_symlink()
                  assert path.stat().st_size == row['bytes'] and sha(path) == row['sha256']

          validate_stage()
          assert api('repos/' + public)['private'] is False
          # Explicitly pin the tag before creating a draft: a draft release alone need
          # not create its Git reference. A pre-existing conflicting tag is never moved.
          tag = api('repos/' + public + '/git/ref/tags/' + plan['tag'], optional=True)
          if tag is None:
              tag = api('repos/' + public + '/git/refs', {'ref':'refs/tags/' + plan['tag'],'sha':plan['launcher']})
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == plan['launcher']
          releases = []; seen = set()
          for page in range(1, 101):
              chunk = api('repos/' + public + '/releases?per_page=100&page=' + str(page))
              assert type(chunk) is list
              for value in chunk:
                  assert value['id'] not in seen; seen.add(value['id'])
                  if value['tag_name'] == plan['tag']: releases.append(value)
              if len(chunk) < 100: break
          else: raise RuntimeError('Release listing exceeded bound')
          assert len(releases) <= 1
          if releases:
              release = api('repos/' + public + '/releases/' + str(releases[0]['id']))
          else:
              release = api('repos/' + public + '/releases', {'tag_name': plan['tag'], 'target_commitish': plan['launcher'], 'name': plan['title'], 'body': plan['body'], 'draft': True, 'prerelease': True})
          def identity(value):
              assert value['tag_name'] == plan['tag'] and value['target_commitish'] == plan['launcher']
              assert value['name'] == plan['title'] and value['body'] == plan['body']
              assert value['prerelease'] is True
          def remote_assets(value, complete=False):
              names = [a['name'] for a in value['assets']]
              assert len(names) == len(set(names)) and set(names) <= set(expected)
              if complete: assert set(names) == set(expected)
              for a in value['assets']:
                  e = expected[a['name']]
                  assert a['state'] == 'uploaded' and a['size'] == e['bytes'] and a['digest'] == 'sha256:' + e['sha256']
          identity(release); remote_assets(release)
          if not release['draft']: remote_assets(release, True)
          present = {a['name'] for a in release['assets']}
          for name in sorted(set(expected) - present):
              assert release['draft']
              result = subprocess.run(['gh', 'release', 'upload', plan['tag'], str(stage / name), '--repo', public], capture_output=True)
              if result.returncode: raise RuntimeError('Public APK asset upload failed; draft retained')
          release = api('repos/' + public + '/releases/' + str(release['id']))
          identity(release); remote_assets(release, True)
          tag = api('repos/' + public + '/git/ref/tags/' + plan['tag'])['object']
          assert tag['type'] == 'commit' and tag['sha'] == plan['launcher']
          for asset in release['assets']:
              size, digest = stream_asset(public, asset['id'])
              assert size == expected[asset['name']]['bytes'] and digest == expected[asset['name']]['sha256']
          validate_stage()
          if release['draft']:
              command = ['gh', 'api', 'repos/' + public + '/releases/' + str(release['id']), '--method', 'PATCH', '--input', '-']
              result = subprocess.run(command, input=json.dumps({'draft': False}).encode(), capture_output=True)
              if result.returncode: raise RuntimeError('Publication failed; verified draft retained')
              release = json.loads(result.stdout)
          identity(release); remote_assets(release, True); assert release['draft'] is False
          print(release['html_url'])

          PY
      - name: Remove temporary APK copies
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/aoh3-reviewed-promotion"
