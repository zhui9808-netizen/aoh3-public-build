name: Compare two private V89 stage receipts
on:
  push:
    branches: [diagnose-v89-reuse-45642855102]
permissions: {}
concurrency:
  group: diagnose-v89-reuse-45642855102-once
  cancel-in-progress: false
jobs:
  read:
    if: github.repository_id == '1417062648' && github.repository == 'zhui9808-netizen/aoh3-public-build' && github.ref == 'refs/heads/diagnose-v89-reuse-45642855102' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify and retain exact bounded diagnostic privately
        env:
          BUILD_SOURCE_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import base64, hashlib, io, json, os, re, urllib.error, urllib.parse, urllib.request, zipfile

          PUBLIC = '/repos/zhui9808-netizen/aoh3-public-build'
          PRIVATE = '/repos/zhui9808-netizen/codex-test'
          BASE = 'd0ed10e6d6694b35bc752e521373783a6848a644'
          BRANCH = 'refs/heads/diagnose-v89-reuse-45642855102'
          WORKFLOW = '.github/workflows/diagnose-v89-reuse-45642855102.yml'
          ROWS = [[458295255,"build-checkpoint-ec6c699473f9-run45642855102-1",[[792073273,"prebuild-repair.json",95060,"4af034a4f6a4c44edf0f907e753489e75d539dcb9c24f61c83bd3d5ec2a3beca"],[792068586,"repair-test-combat-hooks.json",623,"d415e13316d8cd3543b4ad892eb6cfc5a63ea0200ef841fdd57cc7385a17c058"]]],[458355008,"build-checkpoint-ec6c699473f9-run45642855102-2",[[792280751,"prebuild-repair.json",95060,"3fb80c2e4b7b4bc16bc1d31910e1a957b4ba6944ff5ccc785ca305389827ca93"],[792276257,"repair-test-combat-hooks.json",623,"48dcc61c755d91b5f7b6a0383d37bc8f6806d714b405761fcb981505726e14dc"]]]]
          SOURCE = 'ec6c699473f9bdc3beb9012c6f713b0a3139c651'
          TREE = '61c61cba08defc037541a2c0e2735d1da3eeaf16'
          HEX = re.compile(r'[0-9a-f]{40}')

          def need(ok):
              if not ok:
                  raise ValueError('guard rejected')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          token = os.environ.get('BUILD_SOURCE_TOKEN', '')

          def request(url, limit, *, auth=False, accept='application/vnd.github+json', payload=None):
              headers = {'Accept': accept, 'User-Agent': 'AOH3-owner-diagnostic-once'}
              if auth:
                  need(url.startswith('https://api.github.com/') and token)
                  headers['Authorization'] = 'Bearer ' + token
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              if payload is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=payload, headers=headers)
              with opener.open(req, timeout=30) as response:
                  body = response.read(limit + 1)
              need(len(body) <= limit)
              return body

          def api(path, *, auth=False, payload=None):
              return json.loads(request('https://api.github.com' + path, 2_000_000,
                                        auth=auth, payload=payload))

          def download(asset_id, size):
              path = PRIVATE + '/releases/assets/' + str(asset_id)
              try:
                  return request('https://api.github.com' + path, size, auth=True,
                                 accept='application/octet-stream')
              except urllib.error.HTTPError as response:
                  need(response.code in (301, 302, 303, 307, 308))
                  dest = response.headers['Location']
                  response.close()
                  p = urllib.parse.urlsplit(dest)
                  need(p.scheme == 'https' and p.netloc in
                       ('release-assets.githubusercontent.com', 'objects.githubusercontent.com'))
                  return request(dest, size, accept='application/octet-stream')

          def check_private():
              repo = api(PRIVATE, auth=True)
              need(repo.get('id') == 1357139625 and repo.get('private') is True
                   and repo.get('visibility') == 'private'
                   and repo.get('full_name') == PRIVATE.removeprefix('/repos/'))

          def main():
              sha = os.environ.get('GITHUB_SHA', '')
              need(os.environ.get('GITHUB_REPOSITORY_ID') == '1417062648'
                   and os.environ.get('GITHUB_REPOSITORY') == PUBLIC.removeprefix('/repos/')
                   and os.environ.get('GITHUB_REF') == BRANCH
                   and os.environ.get('GITHUB_WORKFLOW_REF') ==
                       PUBLIC.removeprefix('/repos/') + '/' + WORKFLOW + '@' + BRANCH
                   and os.environ.get('GITHUB_EVENT_NAME') == 'push'
                   and os.environ.get('GITHUB_RUN_ATTEMPT') == '1'
                   and HEX.fullmatch(sha))
              with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
                  event = json.load(stream)
              need((event.get('created') is True or event.get('before') == BASE) and event.get('deleted') is False
                   and event.get('forced') is False and event.get('after') == sha
                   and event.get('ref') == BRANCH
                   and event['repository']['id'] == 1417062648)
              commit = api(PUBLIC + '/commits/' + sha)
              need(commit['sha'] == sha and [p['sha'] for p in commit['parents']] == [BASE]
                   and [(f['filename'],f['status']) for f in commit['files']] == [(WORKFLOW,'added')])
              check_private()
              records = {}
              for release_id, tag, assets in ROWS:
                  rel = api(PRIVATE + '/releases/' + str(release_id), auth=True)
                  need(rel.get('id') == release_id and rel.get('draft') is True and rel.get('tag_name') == tag and rel.get('target_commitish') == SOURCE)
                  attempt = int(tag.rsplit('-', 1)[1])
                  for asset_id, name, size, digest in assets:
                      [a] = [x for x in rel['assets'] if x.get('id') == asset_id]
                      need(a.get('name') == name and a.get('size') == size and a.get('state') == 'uploaded' and a.get('digest') == 'sha256:' + digest)
                      raw = download(asset_id, size)
                      need(len(raw) == size and hashlib.sha256(raw).hexdigest() == digest)
                      row = json.loads(raw)
                      need(row.get('sourceCommit') == SOURCE and row.get('sourceTree') == TREE and row.get('stage') == name.removesuffix('.json'))
                      need(str(row.get('attempt')) == str(attempt) and str(row.get('run')) == '45642855102')
                      need(re.fullmatch('[0-9a-f]{64}', row['inputsSha256']))
                      records.setdefault(name, {})[attempt] = row['inputsSha256']
              need(len(records) == 2 and all(len(v) == 2 for v in records.values()))
              result = {'run': 45642855102, 'source': SOURCE, 'sameInput': {k: v[1] == v[2] for k, v in records.items()}}
              content = json.dumps(result, ensure_ascii=False, sort_keys=True).encode()
              need(len(content) <= 64000 and token.encode() not in content)
              check_private()
              answer = api(PRIVATE + '/git/blobs', auth=True, payload=json.dumps({
                  'content': base64.b64encode(content).decode(), 'encoding': 'base64'
              }).encode())
              blob = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              need(answer.get('sha') == blob)
              print(blob)

          try:
              main()
          except Exception:
              raise SystemExit('diagnostic unavailable') from None
          PY
